services:
  database:
    build:
      context: database
      dockerfile: Dockerfile
      args:
        # on-playa DB is 9.4 (ephemeral) — match it
        MYSQL_VERSION: "11.8"
    container_name: census-database
    image: burning-man/census-database
    environment:
      MYSQL_ROOT_PASSWORD: admin
    security_opt:
      - apparmor:unconfined
    ports:
      - "3306:3306"
    restart: always
  dnsmasq:
#    build:
#      context: dnsmasq
#      dockerfile: Dockerfile
    image: jpillora/dnsmasq
    container_name: census-dnsmasq
#    image: burning-man/census-dnsmasq
    volumes: 
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
    security_opt:
      - apparmor:unconfined
    cap_add: ["NET_ADMIN"]
    ports:
      - "192.168.11.11:53:53"
      - "192.168.11.11:53:53/udp"
    restart: always
  census:
    build:
      context: client
      dockerfile: Dockerfile
    container_name: census-app
    env_file:
      - ./client/.env.production
    image: burning-man/census-app
    security_opt:
      - apparmor:unconfined
    ports:
      # 3000 kept so tablets pointed at http://192.168.11.11:3000/ still work.
      # Ports 80/443 are owned by census-nginx (TLS terminator) below.
      - "3000:3000"
    restart: always
  # TLS terminator (2026-08-24): serves https://volunteers.census.burningman.org
  # on the LAN with the copied Let's Encrypt cert so PWA install / service
  # workers / httpOnly device+session cookies get a secure context. Proxies to
  # census:3000. Cert lives OUTSIDE the repo at /home/mew/census-certs on the box
  # (copied from prod; never committed) — refresh it before the cert's Oct 2026
  # expiry / whenever prod renews.
  nginx:
    image: nginx:alpine
    container_name: census-nginx
    depends_on:
      - census
    volumes:
      - ./nginx/census.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/mew/census-certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /home/mew/census-certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    security_opt:
      - apparmor:unconfined
    ports:
      - "80:80"
      - "443:443"
    restart: always
