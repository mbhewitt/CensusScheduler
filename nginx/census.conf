# TLS terminator for the on-playa box: serves the single origin
# volunteers.census.burningman.org over HTTPS with the copied Let's Encrypt cert,
# proxies to the app container (census:3000). Restores a secure context on the
# LAN so PWA install / service workers / httpOnly device+session cookies work.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://volunteers.census.burningman.org$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name volunteers.census.burningman.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://census:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
