# TLS terminator for the on-playa box: serves the single origin
# volunteers.census.burningman.org over HTTPS with the copied Let's Encrypt cert,
# proxies to the app container (census:3000). Restores a secure context on the
# LAN so PWA install / service workers / httpOnly device+session cookies work.
# Captive-portal / "am I online?" checks: tablets (Android, UNISOC, etc.) probe
# a URL expecting a bare HTTP 204. Any such probe whose domain falls through
# dnsmasq's wildcard lands here — answer 204 directly so the tablet considers
# itself online, instead of a 301/redirect (which reads as a captive portal and
# fails the check). Covers the common paths; add more here if a device uses a
# different one. This makes connectivity work locally without per-vendor DNS
# passthroughs or internet reachability.
server {
    listen 80 default_server;
    server_name _;
    location = /generate_204 { return 204; }
    location = /gen_204 { return 204; }
    location = /generate204 { return 204; }
    location / { return 301 https://volunteers.census.burningman.org$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name volunteers.census.burningman.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /generate_204 { return 204; }
    location = /gen_204 { return 204; }
    location = /generate204 { return 204; }
    location / {
        proxy_pass http://census:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
